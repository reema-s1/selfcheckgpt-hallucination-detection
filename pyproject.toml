[project]
name = "selfcheck-hallucination"
version = "0.1.0"
description = "Implementation of SelfCheckGPT: zero-resource black-box hallucination detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "transformers>=4.44",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "datasets>=2.19",
    "spacy>=3.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selfcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
